{% extends 'user_base/base.html' %}
{% block title %}Page Not Found – NØ&CO{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center px-4 py-20 bg-white text-black">
    <div class="text-center max-w-lg mx-auto">
        <h1 class="text-[120px] md:text-[160px] font-extrabold leading-none tracking-tighter text-black select-none" style="font-family: 'Playfair Display', serif;">404</h1>
        <h2 class="text-sm md:text-base font-bold uppercase tracking-[0.3em] mb-4 text-neutral-800">Page Not Found</h2>
        <div class="w-12 h-[1px] bg-black mx-auto mb-6"></div>
        <p class="text-neutral-500 text-xs md:text-sm mb-10 leading-relaxed uppercase tracking-wider max-w-sm mx-auto">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
        </p>
        <a href="{% url 'home' %}" class="inline-block bg-black text-white hover:bg-neutral-800 transition-colors duration-300 px-8 py-3.5 text-xs font-bold uppercase tracking-[0.2em]">
            Return Home
        </a>
    </div>
</div>
{% endblock %}
